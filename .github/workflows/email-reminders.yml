name: Rappels d'Entretien par E-mail & Web Push

on:
  # Période de test : exécution automatique toutes les 5 minutes
  schedule:
    - cron: '*/5 * * * *'
  # Possibilité de déclencher manuellement depuis l'onglet Actions sur GitHub
  workflow_dispatch:
    inputs:
      force_send:
        description: "Forcer l'envoi immédiat de toutes les alertes (ignore le cooldown) ?"
        required: false
        type: boolean
        default: true
      test_mode:
        description: "Envoyer un e-mail de test immédiat au lieu des vraies alertes ?"
        required: false
        type: boolean
        default: false
      test_push:
        description: "Envoyer une notification Web Push de test immédiate sur les téléphones ?"
        required: false
        type: boolean
        default: false

jobs:
  send-email-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances
        run: npm install nodemailer firebase-admin web-push

      - name: Vérification des échéances et envoi des alertes
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ROOM_ID: ${{ secrets.FIREBASE_ROOM_ID }}
          FIREBASE_PROJECT_ID: 'entretien-auto-tracker'
          APP_URL: 'https://ishak8bd.github.io/Carnet-dEntretien-AUTO/'
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY || 'BBkQiwciU2eY1iWtPhEZhVHffN1p82QiHSF5DLi5nefWrS6sDsAGbw7Zqy83jH-5Qn97YMd6uLHQM1wfHLFv5_0' }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:contact@carnet-auto.local' }}
        run: |
          if [ "${{ inputs.test_push }}" = "true" ]; then
            node scripts/send-email-reminders.mjs --test-push
          elif [ "${{ inputs.test_mode }}" = "true" ]; then
            node scripts/send-email-reminders.mjs --test
          elif [ "${{ inputs.force_send }}" = "true" ]; then
            node scripts/send-email-reminders.mjs --force
          else
            node scripts/send-email-reminders.mjs
          fi
